<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found</title>
  <script>
    // 重定向到 index.html，让 Vue Router 处理路由
    const redirectPath = window.location.pathname.replace('/ScrewLake', '');
    window.location.replace(`/ScrewLake/#${redirectPath}`);
  </script>
</head>
<body>
  <h1>Redirecting...</h1>
</body>
</html>
