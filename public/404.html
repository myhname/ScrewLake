<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found</title>
  <script>
    // 取当前路径，并重定向到 index.html，同时保留路径
    const redirectPath = window.location.pathname;
    const basePath = '/ScrewLake'; // 请替换为你的 base 路径
    if (redirectPath.startsWith(basePath)) {
      window.location.replace(`${basePath}/index.html${redirectPath.substring(basePath.length)}`);
    } else {
      window.location.replace(`${basePath}/index.html`);
    }
  </script>
</head>
<body>
  <h1>Redirecting...</h1>
</body>
</html>
