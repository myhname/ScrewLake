<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found</title>
  <script>
    (function () {
      const basePath = '/ScrewLake'; // 请确保与 vite.config.ts 中的 base 配置一致
      const currentPath = window.location.pathname;

      // 如果当前路径已经是 index.html，则避免死循环
      if (currentPath === `${basePath}/index.html`) {
        console.error('Redirect loop detected. Aborting...');
        return;
      }

      // 将用户重定向到 index.html，并保留当前路径作为查询参数传递
      const targetUrl = `${basePath}/index.html?redirect=${encodeURIComponent(currentPath)}`;
      window.location.replace(targetUrl);
    })();
  </script>
</head>
<body>
  <h1>Redirecting...</h1>
</body>
</html>
