<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>

    <link rel="stylesheet" type="text/css" href="/ScrewLake/loading.css">
    <title> 螺丝湖-水怪之家 </title>
  <script type="module" crossorigin src="/ScrewLake/assets/js/index-PzTABv7i-20260118035458.js"></script>
  <link rel="stylesheet" crossorigin href="/ScrewLake/assets/css/style-o2nfq0Jt-20260118035458.css">
</head>
<body>
<div id="app">
    <div id="loading-mask">
        <div class="loading-wrapper">
            <span class="loading-dot loading-dot-spin"><i></i><i></i><i></i><i></i></span>
        </div>
    </div>
</div>

<script type="text/javascript">
    document.addEventListener('visibilitychange', function () {
        if (document.hidden) {
            document.title = "呜呜呜~，不要离开我"
            // 在这里可以触发其它事件或调用特定函数
        } else {
            document.title = "欢迎来到螺丝湖~"
            // 在这里可以触发其它事件或调用特定函数
        }
    });
</script>
<script type="text/javascript">
    (function () {
        const urlParams = new URLSearchParams(window.location.search);
        const redirectPath = urlParams.get('redirect');
        const basePath = '/ScrewLake'; // 请确保与 vite.config.ts 的 base 配置一致

        if (redirectPath) {
            // 检查 redirectPath 是否已经包含 basePath，避免重复拼接
            const targetPath = redirectPath.startsWith(basePath) ? redirectPath : `${basePath}${redirectPath}`;

            // 使用 History API 重写 URL，交给 Vue Router 处理
            history.replaceState(null, '', targetPath);
        }
    })();
</script>
</body>
</html>
